[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "conveyor"
dynamic = ["version"]
description = "Streaming inference pipeline with stage-level parallelism and dynamic batching"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["inference", "pipeline", "batching", "gpu", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
metrics = ["prometheus_client>=0.20"]
all = ["prometheus_client>=0.20"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/conveyor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/conveyor"]
